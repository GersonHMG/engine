[package]
name = "ssl-sim-cli"
description = "Runs SSL simulator scenarios and reports the result as JSON"
version.workspace = true
edition.workspace = true

[[bin]]
name = "engine-sim"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ssl-sim = { path = "../sim" }
ssl-sim-scenario = { path = "../scenario" }
